<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynasty Power Dialer</title>
    <link rel="icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --divider-color: rgba(255, 255, 255, 0.1);
        }

        body.light-mode {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --border-color: rgba(0, 0, 0, 0.1);
            --divider-color: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
            font-size: 16px;
        }

        /* Top Nav */
        .top-nav {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--divider-color);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-logo-divider {
            width: 1px;
            height: 24px;
            background: var(--divider-color);
            margin: 0 14px;
        }

        .nav-logo-sub {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .broken-o {
            display: inline-block;
            width: 28px;
            height: 32px;
            position: relative;
        }

        .broken-o svg { width: 100%; height: 100%; }
        .broken-o svg circle { stroke: var(--text-primary); }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 40px; height: 40px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }
        .theme-toggle:hover { background: var(--bg-secondary); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            font-size: 14px; font-weight: 500;
            border-radius: 8px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-logout:hover { background: var(--bg-secondary); }

        /* Controls Bar */
        .controls-bar {
            width: 100%;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--divider-color);
            background: var(--bg-secondary);
        }

        .control-item { display: flex; align-items: center; gap: 8px; }

        .control-label {
            font-size: 13px; font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .control-input {
            padding: 10px 14px; font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 500; font-family: inherit;
            transition: all 0.2s ease;
        }
        .control-input:focus { outline: none; border-color: rgba(107,144,128,0.5); }
        .control-input:disabled { opacity: 0.5; cursor: not-allowed; }
        select.control-input { cursor: pointer; min-width: 160px; }
        input[type="tel"].control-input { min-width: 160px; }

        .phone-wrapper { display: flex; align-items: center; gap: 4px; }

        .phone-prefix {
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 600; color: var(--text-primary); font-size: 16px;
        }

        .controls-divider {
            width: 1px; height: 32px;
            background: var(--divider-color);
            margin: 0 8px;
        }

        .btn-start {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 32px;
            font-size: 15px; font-weight: 600;
            border-radius: 8px; cursor: pointer;
            transition: all 0.2s ease;
            margin-left: auto;
        }
        .btn-start:hover:not(:disabled) { background: rgba(255,255,255,0.15); transform: translateY(-1px); }
        .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-stop { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.3); color: rgba(239,68,68,0.9); }

        /* Analytics */
        .analytics-section {
            width: 100%;
            border-bottom: 1px solid var(--divider-color);
            padding-bottom: 20px;
        }

        .analytics-header {
            padding: 20px 0; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            transition: all 0.2s ease; position: relative;
        }

        .analytics-header h3 {
            color: var(--text-primary);
            font-size: 14px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        .analytics-chevron {
            width: 16px; height: 16px;
            stroke: var(--text-secondary);
            transition: transform 0.3s ease;
        }

        .analytics-section.expanded .analytics-chevron { transform: rotate(180deg); }

        .analytics-content {
            max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .analytics-section.expanded .analytics-content { max-height: 2000px; }

        .analytics-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }

        .analytics-stat-card { text-align: center; padding: 20px; }

        .analytics-stat-label {
            color: var(--text-secondary);
            font-size: 12px; font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }

        .analytics-stat-value { color: var(--text-primary); font-size: 32px; font-weight: 700; }

        /* Centered Action Section */
        .centered-action-section {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; min-height: 80px;
            padding: 20px 0;
        }

        .centered-action-section .status-indicator { margin-bottom: 0; padding: 8px 20px; font-size: 13px; }
        .centered-action-section .status-indicator .status-dot { width: 6px; height: 6px; }
        .centered-action-section .btn-start { font-size: 20px; padding: 18px 56px; min-width: 220px; margin-left: 0; }

        /* Main Content */
        .main-content {
            max-width: 100%; margin: 0 auto;
            padding: 20px 40px 0px 40px;
            display: flex; flex-direction: column;
            flex: 1;
        }

        /* Status */
        .status-indicator {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 12px 24px; border-radius: 24px;
            font-size: 14px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); }
        .status-indicator.idle .status-dot { background: #6b9080; }
        .status-indicator.dialing .status-dot,
        .status-indicator.on-call .status-dot { background: #ef4444; animation: pulse 2s ease-in-out infinite; }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Race Cards */
        .call-race-container {
            display: block; margin-bottom: 20px;
            flex: 1 1 auto;
            height: calc(100vh - 280px);
            min-height: 420px;
            position: relative;
        }
        .call-race-container:not(.active) { visibility: hidden; }
        .call-race-container.active { display: block; }

        .call-race-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 24px; max-width: 100%; margin: 0 auto; width: 100%;
            height: 100%;
        }

        .race-card-wrapper { height: 100%; min-height: 420px; position: relative; overflow: visible; }
        
        .race-card-back, .race-card-front {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.6s;
        }

        .race-card-back {
            background: var(--bg-secondary);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center;
        }
        body.light-mode .race-card-back { border-color: rgba(0,0,0,0.3); background: rgba(0,0,0,0.04); }

        .race-card-front { 
    transform: rotateY(180deg); 
    background: var(--bg-secondary);
    overflow: hidden;
}
        .race-card-front .race-card { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; }

        .race-card-wrapper.flipped .race-card-back { transform: rotateY(180deg); }
        .race-card-wrapper.flipped .race-card-front { transform: rotateY(0deg); }

        .race-card-wrapper.dealing {
            animation: dealFromButton 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }
        .race-card-wrapper.dealing.card-1 { animation-delay: 0s; }
        .race-card-wrapper.dealing.card-2 { animation-delay: 0.25s; }
        .race-card-wrapper.dealing.card-3 { animation-delay: 0.5s; }

        @keyframes dealFromButton {
            0% { transform: translateY(var(--deal-offset-y,400px)) translateX(var(--deal-offset-x,0px)) scale(0.8); opacity: 0; }
            100% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
        }

        .race-card-wrapper.dealing-back { animation: dealBackToButton 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .race-card-wrapper.dealing-back.card-1 { animation-delay: 0s; }
        .race-card-wrapper.dealing-back.card-2 { animation-delay: 0.25s; }
        .race-card-wrapper.dealing-back.card-3 { animation-delay: 0.5s; }

        @keyframes dealBackToButton {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 1; }
            100% { transform: translateY(var(--deal-offset-y,400px)) translateX(var(--deal-offset-x,0px)) scale(0.8); opacity: 0; }
        }

        .race-card-subtitle { font-size: 13px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 8px; opacity: 0.7; }

        .race-card {
    background: var(--bg-secondary);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 32px;
    transition: all 0.4s ease; position: relative;
    height: 100%; display: flex; flex-direction: column; justify-content: flex-start;
    overflow: visible;
}

        .race-card.searching { border: 2px solid rgba(255,255,255,0.3); background: var(--bg-secondary); position: relative; overflow: visible; }

        .race-card.searching::after {
            content: ''; position: absolute; inset: -4px; border-radius: 16px; padding: 4px;
            background: conic-gradient(from var(--angle), transparent 0deg, transparent 300deg, rgba(255,255,255,1) 330deg, rgba(255,255,255,1) 360deg);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowTrace 2.5s linear infinite; pointer-events: none;
        }
        body.light-mode .race-card.searching::after { background: conic-gradient(from var(--angle), transparent 0deg, transparent 300deg, rgba(0,0,0,1) 330deg, rgba(0,0,0,1) 360deg); }

        .race-card.searching::before {
            content: ''; position: absolute; inset: -4px; border-radius: 16px; padding: 4px;
            background: conic-gradient(from var(--angle), transparent 0deg, transparent 120deg, rgba(255,255,255,1) 150deg, rgba(255,255,255,1) 180deg, transparent 210deg, transparent 360deg);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: borderGlowTrace 2.5s linear infinite; pointer-events: none;
        }
        body.light-mode .race-card.searching::before { background: conic-gradient(from var(--angle), transparent 0deg, transparent 120deg, rgba(0,0,0,1) 150deg, rgba(0,0,0,1) 180deg, transparent 210deg, transparent 360deg); }

        @keyframes borderGlowTrace { from { --angle: 0deg; } to { --angle: 360deg; } }

        .race-card.ringing { animation: cardPulse 0.8s ease-in-out infinite; }
        @keyframes cardPulse {
            0%,100% { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 15px rgba(255,255,255,0.2); }
            50% { border-color: rgba(255,255,255,0.6); box-shadow: 0 0 25px rgba(255,255,255,0.4); }
        }

        .race-card.human { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.5); box-shadow: 0 0 30px rgba(34,197,94,0.3); animation: none; }
        .race-card.machine { background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); opacity: 0.4; animation: none; }
        .race-card.busy { background: rgba(255,107,53,0.1); border-color: rgba(255,107,53,0.3); opacity: 0.4; animation: none; }
        .race-card.ended { opacity: 0.3; animation: none; }
.race-card.speaking { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.5); box-shadow: 0 0 30px rgba(59,130,246,0.3); animation: speakingPulse 0.8s ease-in-out infinite; }
@keyframes speakingPulse {
    0%,100% { border-color: rgba(59,130,246,0.4); box-shadow: 0 0 15px rgba(59,130,246,0.2); }
    50% { border-color: rgba(59,130,246,0.8); box-shadow: 0 0 30px rgba(59,130,246,0.5); }
}
.race-card.speaking .race-card-status { color: rgba(59,130,246,1); }

        .race-card-status { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
        body.light-mode .race-card-status { color: rgba(0,0,0,0.7); }
        .race-card.human .race-card-status { color: rgba(34,197,94,1); }
        .race-card.machine .race-card-status { color: rgba(251,191,36,0.9); }
        .race-card.busy .race-card-status { color: rgba(255,107,53,0.9); }
        .race-card.ended .race-card-status { color: rgba(255,255,255,0.4); }
        .race-status-icon { font-size: 22px; }

        .race-card-name { color: var(--text-primary); font-size: 28px; font-weight: 700; margin-bottom: 0px; line-height: 1.2; }
        .race-card.machine .race-card-name, .race-card.busy .race-card-name, .race-card.ended .race-card-name { opacity: 0.6; }
        .race-card-info { color: var(--text-secondary); font-size: 16px; margin-bottom: 8px; }
        .race-card.machine .race-card-info, .race-card.busy .race-card-info, .race-card.ended .race-card-info { opacity: 0.5; }

        .race-card-divider { width: 100%; height: 1px; background: var(--divider-color); margin: 14px 0 18px 0; }

        .race-card-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            flex: 1;
        }

        .race-card-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 0;
            border-bottom: 1px solid var(--divider-color);
        }

        /* Right column fields get a left border as divider */
        .race-card-field:nth-child(even) {
            padding-left: 24px;
            border-left: 1px solid var(--divider-color);
        }

        .race-card-field--full {
            grid-column: 1 / -1;
            padding-left: 0;
            border-left: none;
        }

        /* Remove bottom border from last two fields before notes */
        .race-card-field--full:last-child {
            border-bottom: none;
        }

        .race-card-field--notes {
            margin-top: 2px;
        }

        .race-card-field--notes .race-field-value {
            background: rgba(255,255,255,0.04);
            border-left: 3px solid rgba(255,255,255,0.12);
            border-radius: 4px;
            padding: 10px 12px;
            height: 90px;
            overflow-y: auto;
            line-height: 1.6;
            font-style: italic;
            opacity: 0.85;
        }

        .race-card-field--notes .race-field-value.empty {
            opacity: 0.3;
            font-style: italic;
        }

        .race-field-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .race-field-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .race-winner-badge {
            position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
            background: rgba(34,197,94,1); color: white;
            padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(34,197,94,0.4);
        }

        .race-note-btn {
            position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
            background: rgba(59,130,246,0.9); border: none; border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; z-index: 10;
            box-shadow: 0 4px 12px rgba(59,130,246,0.4); transition: all 0.2s ease;
        }
        .race-note-btn:hover { background: rgba(59,130,246,1); transform: translateX(-50%) scale(1.1); }

        .race-optout-btn {
            position: absolute; bottom: -12px; right: 12px;
            background: rgba(239,68,68,0.9); border: none; border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; z-index: 10;
            box-shadow: 0 4px 12px rgba(239,68,68,0.4); transition: all 0.2s ease;
        }
        .race-optout-btn:hover { background: rgba(239,68,68,1); transform: scale(1.1); }

        .race-disposition-btn {
            position: absolute; bottom: -12px; left: 12px;
            background: rgba(147,51,234,0.9); border: none; border-radius: 50%;
            width: 36px; height: 36px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; z-index: 10;
            box-shadow: 0 4px 12px rgba(147,51,234,0.4); transition: all 0.2s ease;
        }
        .race-disposition-btn:hover { background: rgba(147,51,234,1); transform: scale(1.1); }

        .disposition-compartment {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            margin-top: 20px; width: 100%;
            background: rgba(26,26,26,0.98);
            border: 1px solid rgba(147,51,234,0.3); border-radius: 12px; padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 15;
            max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease;
        }
        .disposition-compartment.open { max-height: 400px; opacity: 1; }
        .disposition-compartment-header { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 16px; }

        .disposition-option {
            padding: 12px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            margin-bottom: 8px; cursor: pointer; transition: all 0.2s ease;
            font-size: 14px; color: #fff;
        }
        .disposition-option:hover { background: rgba(147,51,234,0.2); border-color: rgba(147,51,234,0.4); }
        .disposition-option.selected { background: rgba(147,51,234,0.3); border-color: rgba(147,51,234,0.6); }

        .note-compartment {
            position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
            margin-top: 20px; width: 100%;
            background: rgba(26,26,26,0.98);
            border: 1px solid rgba(59,130,246,0.3); border-radius: 12px; padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 15;
            max-height: 0; overflow: hidden; opacity: 0; transition: all 0.3s ease;
        }
        .note-compartment.open { max-height: 400px; opacity: 1; }
        .note-compartment-header { color: #fff; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
        .note-compartment-subheader { color: rgba(255,255,255,0.6); font-size: 12px; margin-bottom: 16px; }

        .note-textarea {
            width: 100%; min-height: 120px; padding: 12px;
            background: #0a0a0a; border: 1px solid #333; border-radius: 8px;
            color: #fff; font-size: 14px; font-family: inherit;
            resize: vertical; margin-bottom: 12px;
        }
        .note-textarea:focus { outline: none; border-color: rgba(59,130,246,0.5); }
        .note-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .note-btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
        .note-btn-cancel { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.15); }
        .note-btn-save { background: rgba(59,130,246,0.9); color: white; }
        .note-btn-save.saved { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); cursor: default; }

        /* Login */
        .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .login-container { text-align: center; max-width: 400px; }
        .login-container h2 { color: var(--text-primary); font-size: 32px; font-weight: 700; margin-bottom: 8px; }
        .login-container p { color: var(--text-secondary); font-size: 15px; margin-bottom: 32px; }
        .login-form { display: flex; flex-direction: column; gap: 16px; }
        .login-input { padding: 12px 16px; font-size: 16px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-secondary); color: var(--text-primary); font-family: inherit; text-align: center; }
        .login-input:focus { outline: none; border-color: rgba(107,144,128,0.5); }
        .btn-primary { background: rgba(255,255,255,0.1); color: var(--text-primary); border: 1px solid var(--border-color); padding: 14px 32px; font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary:hover { background: rgba(255,255,255,0.15); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Messages */
        .message { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 2000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .error { background: rgba(20,5,5,0.97); border: 1px solid rgba(239,68,68,0.6); color: #ff6b6b; }
        .success { background: rgba(5,20,5,0.97); border: 1px solid rgba(34,197,94,0.6); color: #6bff6b; }

        /* Responsive */
        @media (max-width: 1200px) { .analytics-stats-grid { grid-template-columns: repeat(3, 1fr); } }

        @media (max-width: 768px) {
            .top-nav { padding: 12px 16px; }
            .nav-logo { font-size: 18px; }
            .nav-logo-sub { display: none; }
            .broken-o { width: 20px; height: 24px; }
            .controls-bar { padding: 12px 16px; flex-direction: row; flex-wrap: wrap; gap: 12px; align-items: stretch; justify-content: space-between; }
            .control-item { width: 100%; justify-content: center; }
            .control-item:has(#repPhone) { order: 1; justify-content: center; width: 100% !important; }
            .control-item:has(#listSelect), .control-item:has(#regionSelect) { order: 2; width: calc(50% - 6px) !important; flex: 0 0 calc(50% - 6px); }
            .control-label { font-size: 10px; }
            select.control-input { font-size: 12px; min-width: auto; padding: 8px 10px; }
            .controls-divider { display: none; }
            .analytics-section { padding: 12px 16px 12px 16px !important; }
            .analytics-header { padding: 12px 0; }
            .analytics-header h3 { font-size: 11px; }
            .analytics-stats-grid { grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px auto; }
            .analytics-stat-card { padding: 10px; }
            .analytics-stat-label { font-size: 9px; margin-bottom: 4px; }
            .analytics-stat-value { font-size: 18px; }
            .main-content { padding: 12px 16px 0px 16px; }
            .call-race-container { min-height: 180px; margin-bottom: 12px; }
            .call-race-grid { grid-template-columns: 1fr; gap: 12px; }
            .race-card { padding: 16px; }
            .race-card-name { font-size: 16px; }

            .centered-action-section { min-height: 60px; padding-top: 20px; padding-bottom: 20px; margin-bottom: 20px; gap: 12px; }
            .centered-action-section .status-indicator { padding: 6px 16px; font-size: 11px; }
            .centered-action-section .btn-start { font-size: 16px; padding: 14px 40px; min-width: 180px; }
            .note-compartment { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); margin-top: 0; width: calc(100% - 40px); max-width: 500px; z-index: 100; }
        }
    </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const N8N_BASE = 'https://commacashing.app.n8n.cloud/webhook';
    const START_URL = `${N8N_BASE}/start-dynasty`;
    const STOP_URL  = `${N8N_BASE}/stop-dynasty`;
    const COMPANY_CODE = 'dynasty';

    let supabaseClient = null;
    let webhookSecret = '';
    let isDialing = false;
    let sessionId = null;
    let supabaseSubscription = null;
    let currentBatchContacts = new Map();
    let pendingEvents = new Map();
let cardsReady = false;
let pollInterval = null;
let currentBatchId = null;
let knownCallSids = new Set();
let repPhone = '';

    let currentSessionStats = {
        startTime: null,
        totalCalls: 0,
        connects: 0,
        machines: 0,
        humanAnsweredTime: null,
        callDurations: []
    };

    // Audio
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();

    function playSuccessChime() {
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain); gain.connect(audioContext.destination);
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.type = 'sine'; osc.start(now); osc.stop(now + 0.4);
    }

    // ============================================
    // INIT
    // ============================================
    window.addEventListener('DOMContentLoaded', async () => {
        await initSupabase();

        const savedTheme = localStorage.getItem('dynasty_theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeToggle').textContent = '☀️';
        }

        // Load stats from localStorage on page load
        const savedStats = localStorage.getItem('dynasty_stats');
        const savedDate = localStorage.getItem('dynasty_stats_date');
        if (savedStats && savedDate === new Date().toDateString()) {
            currentSessionStats = JSON.parse(savedStats);
            updateStatsDisplay();
        }

        if (localStorage.getItem('dynasty_authed') === 'true') {
            showDashboard();
        }

        const phoneEl = document.getElementById('repPhone');
        ['input','change','blur'].forEach(ev => phoneEl.addEventListener(ev, () => formatPhone(phoneEl)));
        phoneEl.addEventListener('paste', () => setTimeout(() => formatPhone(phoneEl), 0));
        document.getElementById('listSelect').addEventListener('change', checkFormValid);
        document.getElementById('regionSelect').addEventListener('change', checkFormValid);
    });

    async function initSupabase() {
        try {
            const res = await fetch('/.netlify/functions/supabase-init', { method: 'POST' });
            const { url, key } = await res.json();
            supabaseClient = window.supabase.createClient(url, key);
            const cfg = await fetch('/.netlify/functions/get-config');
            const cfgData = await cfg.json();
            webhookSecret = cfgData.webhookSecret || '';
            await loadLists();
            loadRegions();
        } catch (e) { console.error('Supabase init failed:', e); }
    }

    // ============================================
    // LOGIN
    // ============================================
    async function handleLogin(e) {
        e.preventDefault();
        const password = document.getElementById('passwordInput').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true; btn.textContent = 'Checking...';

        try {
            const { data, error } = await supabaseClient
                .from('companies')
                .select('admin_passcode')
                .eq('company_code', COMPANY_CODE)
                .single();

            if (error || !data) {
                showError('Could not verify. Try again.');
                btn.disabled = false; btn.textContent = 'Login'; return;
            }

            if (password !== data.admin_passcode) {
                showError('Incorrect passcode.');
                btn.disabled = false; btn.textContent = 'Login';
                document.getElementById('passwordInput').value = ''; return;
            }

            localStorage.setItem('dynasty_authed', 'true');
            showDashboard();
            showSuccess('Welcome to Dynasty Power Dialer!');
        } catch (err) {
            showError(`Login error: ${err.message}`);
            btn.disabled = false; btn.textContent = 'Login';
        }
    }

    function showDashboard() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboardScreen').style.display = 'block';
    }

    function logout() {
        localStorage.removeItem('dynasty_authed');
        if (isDialing) stopDialing();
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboardScreen').style.display = 'none';
        document.getElementById('passwordInput').value = '';
    }

    // ============================================
    // LOAD LISTS & REGIONS
    // ============================================
    async function loadLists() {
        if (!supabaseClient) return;
        try {
            const { data, error } = await supabaseClient
                .from('dynasty_contact_lists')
                .select('file_id, file_name, file_name_original, folder_id')
                .order('file_name_original');
            if (error) throw error;
            const select = document.getElementById('listSelect');
            (data || []).forEach(list => {
                const opt = document.createElement('option');
                opt.value = list.file_id || '';
                // list_source = file_name without .xlsx extension
                opt.dataset.listSource = (list.file_name || '').replace(/\.xlsx$/i, '');
                opt.dataset.folderId = list.folder_id || '';
                opt.textContent = list.file_name_original || list.file_name || list.file_id;
                select.appendChild(opt);
            });
        } catch (e) { console.error('Failed to load lists:', e); }
    }

    function loadRegions() {
        const select = document.getElementById('regionSelect');
        ['Northeast','Southeast','Midwest','Southwest','West'].forEach(r => {
            const opt = document.createElement('option');
            opt.value = r; opt.textContent = r;
            select.appendChild(opt);
        });
    }

    // ============================================
    // FORM
    // ============================================
    function formatPhone(input) {
        let d = input.value.replace(/\D/g, '').slice(0, 10);
        if (d.length >= 6) input.value = `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
        else if (d.length >= 3) input.value = `(${d.slice(0,3)}) ${d.slice(3)}`;
        else input.value = d;
        checkFormValid();
    }

    function checkFormValid() {
        const digits = document.getElementById('repPhone').value.replace(/\D/g, '');
        const list = document.getElementById('listSelect').value;
        const region = document.getElementById('regionSelect').value;
        document.getElementById('startButton').disabled = digits.length !== 10 || !list || !region || isDialing;
    }

    // ============================================
    // DIALING
    // ============================================
    async function startDialing() {
        repPhone = '+1' + document.getElementById('repPhone').value.replace(/\D/g, '');
        const listEl = document.getElementById('listSelect');
        const selectedOpt = listEl.options[listEl.selectedIndex];
        const fileId = listEl.value;
        const listSource = selectedOpt?.dataset.listSource || '';
        const region = document.getElementById('regionSelect').value;

        try {
            isDialing = true;
            sessionId = `session_${Date.now()}`;
            currentSessionStats.startTime = Date.now();
            currentBatchContacts.clear();
pendingEvents.clear();
knownCallSids.clear();
currentBatchId = null;
cardsReady = false;
document.getElementById('callRaceGrid').innerHTML = '';

            document.getElementById('startButton').style.display = 'none';
            document.getElementById('stopButton').style.display = 'inline-block';
            document.getElementById('repPhone').disabled = true;
            document.getElementById('listSelect').disabled = true;
            document.getElementById('regionSelect').disabled = true;

            updateStatus('dialing', 'Dialing Active');
            showEmptyRaceCards();
            subscribeToCallLogs();

            await fetch(START_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-webhook-secret': webhookSecret },
                body: JSON.stringify({ session_id: sessionId, rep_phone: repPhone, file_id: fileId, list_source: listSource, region })
            });

            showSuccess(`Dialing started — ${region}`);
        } catch (err) {
            showError(`Failed to start: ${err.message}`);
            resetDialingState();
        }
    }

    async function stopDialing() {
        for (let i = 0; i < 3; i++) {
            const w = document.getElementById(`race-card-wrapper-${i}`);
            if (w) w.classList.remove('flipped');
        }
        await new Promise(r => setTimeout(r, 600));
        for (let i = 0; i < 3; i++) {
            const w = document.getElementById(`race-card-wrapper-${i}`);
            if (w) w.classList.add('dealing-back');
            await new Promise(r => setTimeout(r, 150));
        }
        await new Promise(r => setTimeout(r, 800));

        document.getElementById('callRaceContainer').classList.remove('active');
        document.getElementById('callRaceGrid').innerHTML = '';
        currentBatchContacts.clear();
        unsubscribeFromSupabase();
        resetDialingState();
        showSuccess('Dialing stopped');

        const stopRepPhone = '+1' + document.getElementById('repPhone').value.replace(/\D/g, '');
        fetch(STOP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-webhook-secret': webhookSecret },
    body: JSON.stringify({ session_id: sessionId, rep_phone: stopRepPhone })
}).catch(e => console.error('Stop failed:', e));
    }

    function resetDialingState() {
        isDialing = false;
        document.getElementById('startButton').style.display = 'inline-block';
        document.getElementById('stopButton').style.display = 'none';
        document.getElementById('repPhone').disabled = false;
        document.getElementById('listSelect').disabled = false;
        document.getElementById('regionSelect').disabled = false;
        updateStatus('idle', 'System Ready');
        checkFormValid();
    }

    // ============================================
    // REALTIME
    // ============================================
    function subscribeToCallLogs() {
    if (!supabaseClient) return;

    knownCallSids.clear();
    currentBatchId = null;

    supabaseClient
    .channel(`dynasty_errors_${sessionId}`)
    .on('postgres_changes', {
        event: 'INSERT', schema: 'public',
        table: 'dynasty_call_logs',
        filter: `rep_phone=eq.${repPhone}`
    }, (payload) => {
        const row = payload.new;
        if (!row || row.event_type !== 'workflow_error') return;
        handleStatusUpdate(row);
    })
    .subscribe();

supabaseSubscription = supabaseClient
        .channel(`dynasty_${sessionId}`)
        .on('postgres_changes', {
            event: 'INSERT', schema: 'public',
            table: 'dynasty_call_logs',
            filter: `session_id=eq.${sessionId}`
        }, (payload) => {
            const row = payload.new;
            if (!row) return;

            // Deduplicate by call_sid + event_type
            const key = `${row.call_sid}_${row.event_type}`;
            if (knownCallSids.has(key)) return;
            knownCallSids.add(key);

            handleStatusUpdate(row);
        })
        .subscribe();
}

    function unsubscribeFromSupabase() {
    if (supabaseSubscription && supabaseClient) {
        supabaseClient.removeChannel(supabaseSubscription);
        supabaseSubscription = null;

    knownCallSids.clear();
    currentBatchId = null;
}

    function normalizePhone(phone) {
        if (!phone) return '';
        const digits = phone.replace(/\D/g, '');
        // Handle both 10-digit (9144710773) and 11-digit (+19144710773) formats
        return '+1' + digits.slice(-10);
    }

    async function handleStatusUpdate(data) {
        if (!data) return;
        const status = data.event_type;
        console.log(`📡 ${status} | ${data.contact_name} | ${data.call_sid}`);

        if (status === 'workflow_started') return;

if (status === 'call_initiated') {
    const index = data.call_index;
    if (index === null || index === undefined) {
        console.warn('call_initiated skipped — no call_index');
        return;
    }

    // New batch detection
    const incomingBatchId = data.batch_id;
    if (incomingBatchId && incomingBatchId !== currentBatchId) {
        const hasActiveHuman = [...currentBatchContacts.values()].some(c => c.status === 'human');
        if (!hasActiveHuman) {
            currentBatchId = incomingBatchId;
            currentBatchContacts.clear();
            resetCardsToSearching();
        }
    }

    currentSessionStats.totalCalls++;
    const contact = {
    name: data.contact_name,
    company: data.contact_company || data.company || '',
    phone: data.phone,
    licenses: data.licenses,
    team_name: data.team_name || '',
    years_at_firm: data.years_at_firm,
    notes: data.notes,
    date_of_birth: data.date_of_birth,
    call_sid: data.call_sid,
    status: 'ringing'
};
    currentBatchContacts.set(data.call_sid, contact);
    updateStatsDisplay();
    if (!cardsReady) {
        pendingEvents.set(data.call_sid, { _type: 'populate', contact, index });
    } else {
        populateRaceCard(data.call_sid, contact, index);
    }
}
        else if (status === 'machine_detected') {
    currentSessionStats.machines++;
    const contact = currentBatchContacts.get(data.call_sid);
    if (!contact || !cardsReady || !document.getElementById(`race-card-${data.call_sid}`)) {
        pendingEvents.set(data.call_sid, data); return;
    }
            contact.status = 'machine';
            updateRaceCard(data.call_sid, 'machine');
            updateStatsDisplay(); checkBatchComplete();
        }
        else if (['call_busy','call_failed','call_no_answer','call_canceled'].includes(status)) {
    const contact = currentBatchContacts.get(data.call_sid);
    if (!contact || !cardsReady || !document.getElementById(`race-card-${data.call_sid}`)) {
        pendingEvents.set(data.call_sid, data); return;
    }
            contact.status = 'busy'; contact.busyType = status;
            updateRaceCard(data.call_sid, 'busy', status);
            checkBatchComplete();
        }
        else if (status === 'inbound_call') {
    showHeroCard(data);
    document.getElementById('callRaceContainer').classList.remove('active');
    document.getElementById('callRaceGrid').innerHTML = '';
    currentBatchContacts.clear();
    updateStatus('on-call', 'On Call');
    isDialing = false;
    document.getElementById('stopButton').style.display = 'none';
    document.getElementById('startButton').style.display = 'inline-block';
    document.getElementById('repPhone').disabled = false;
    document.getElementById('listSelect').disabled = false;
    document.getElementById('regionSelect').disabled = false;
    checkFormValid();
    return;
}
else if (status === 'human_answered') {
            currentSessionStats.connects++;
            currentSessionStats.humanAnsweredTime = Date.now();

            const foundSid = data.call_sid;
            const contact = currentBatchContacts.get(foundSid);
            if (contact) contact.status = 'human';

            if (!cardsReady || !document.getElementById(`race-card-${foundSid}`)) {
                pendingEvents.set(foundSid, data);
            } else {
                updateRaceCard(foundSid, 'human');
            }

            updateStatus('on-call', 'On Call');
            updateStatsDisplay();
            isDialing = false;
            document.getElementById('stopButton').style.display = 'none';
            document.getElementById('startButton').style.display = 'inline-block';
            document.getElementById('repPhone').disabled = false;
            document.getElementById('listSelect').disabled = false;
            document.getElementById('regionSelect').disabled = false;
            checkFormValid();
        }
        else if (status === 'call_completed') {
            if (currentSessionStats.humanAnsweredTime) {
                const dur = (Date.now() - currentSessionStats.humanAnsweredTime) / 1000;
                if (dur > 0 && dur < 3600) currentSessionStats.callDurations.push(Math.round(dur));
                currentSessionStats.humanAnsweredTime = null;
            }
            updateStatsDisplay();
            updateStatus('idle', 'System Ready');
        }
        else if (status === 'speaker_connected') {
    const contact = currentBatchContacts.get(data.call_sid);
    if (!contact || !cardsReady || !document.getElementById(`race-card-${data.call_sid}`)) {
        pendingEvents.set(data.call_sid, data); return;
    }
    contact.status = 'speaking';
    const card = document.getElementById(`race-card-${data.call_sid}`);
    if (card) {
        card.classList.remove('ringing','searching');
        card.classList.add('speaking');
        card.querySelector('.race-card-status').innerHTML = `<span class="race-status-icon">🎤</span><span>Speaking...</span>`;
    }
}
else if (status === 'batches_complete') {
    showSuccess('All contacts dialed!');
}
else if (status === 'workflow_error') {
    const errorTitle = data.details || 'System Error';
    showError(`⚠️ ${errorTitle}`);
    isDialing = false;
    document.getElementById('callRaceContainer').classList.remove('active');
    document.getElementById('callRaceGrid').innerHTML = '';
    currentBatchContacts.clear();
    unsubscribeFromSupabase();
    document.getElementById('stopButton').style.display = 'none';
    document.getElementById('startButton').style.display = 'inline-block';
    document.getElementById('repPhone').disabled = false;
    document.getElementById('listSelect').disabled = false;
    document.getElementById('regionSelect').disabled = false;
    updateStatus('idle', 'System Ready');
    checkFormValid();
}
    }

    function calcAge(dob) {
        if (!dob) return '—';
        const today = new Date();
        const birth = new Date(dob);
        let age = today.getFullYear() - birth.getFullYear();
        const m = today.getMonth() - birth.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
        return age;
    }

    function checkBatchComplete() {
        if (currentBatchContacts.size < 3) return;
        let allResolved = true, anyHuman = false;
        currentBatchContacts.forEach(c => {
            if (c.status === 'ringing') allResolved = false;
            if (c.status === 'human') anyHuman = true;
        });
        if (allResolved && !anyHuman) setTimeout(resetCardsToSearching, 2000);
    }

    function resetCardsToSearching() {
        for (let i = 0; i < 3; i++) {
            const w = document.getElementById(`race-card-wrapper-${i}`);
            if (w) {
                const front = w.querySelector('.race-card-front');
                if (front) front.innerHTML = `
                    <div class="race-card searching" id="race-card-${i}">
                        <div class="race-card-status"></div>
                        <div class="race-card-name">Searching For Contact</div>
                        <div class="race-card-subtitle">Dialing in progress...</div>
                    </div>`;
            }
        }
        currentBatchContacts.forEach((c, sid) => {
            if (c.status !== 'ringing' && c.status !== 'human') currentBatchContacts.delete(sid);
        });
        for (let i = 0; i < 3; i++) {
            const w = document.getElementById(`race-card-wrapper-${i}`);
            if (w) w.classList.remove('flipped');
        }
        setTimeout(() => {
            for (let i = 0; i < 3; i++) {
                const w = document.getElementById(`race-card-wrapper-${i}`);
                if (w) w.classList.add('flipped');
            }
        }, 500);
    }

    async function saveNote(callSid) {
        const text = document.getElementById(`note-text-${callSid}`)?.value.trim();
        if (!text) { showError('Enter a note first.'); return; }
        const contact = currentBatchContacts.get(callSid);
        const btn = document.getElementById(`note-save-btn-${callSid}`);
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
            const res = await fetch(`${N8N_BASE}/save-dynasty-note`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
    call_sid: callSid, 
    contact_name: contact?.name, 
    contact_phone: contact?.phone, 
    note: text,
    session_id: sessionId,
    file_id: document.getElementById('listSelect').value,
    folder_id: document.getElementById('listSelect').options[document.getElementById('listSelect').selectedIndex].dataset.folderId
})
            });

            else { showError('Failed to save note.'); btn.disabled = false; btn.textContent = 'Save'; }

    async function markOptOut(callSid) {

    async function syncLists() {
        const btn = document.getElementById('syncBtn');
        const icon = document.getElementById('syncIcon');

        btn.disabled = true;
        icon.style.animation = 'spin 1s linear infinite';
        icon.style.transformOrigin = 'center';

        try {
            const res = await fetch(`${N8N_BASE}/sync-dynasty-lists`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ company_code: COMPANY_CODE })
            });

            if (!res.ok) throw new Error('Sync failed');

            // Wait for N8N to finish writing to Supabase before reloading
            await new Promise(r => setTimeout(r, 3000));

            // Reload the dropdown
            const select = document.getElementById('listSelect');
            const currentVal = select.value;
            select.innerHTML = '<option value="">Select list...</option>';
            await loadLists();

            // Restore selection if still present
            if (currentVal) {
                const match = [...select.options].find(o => o.value === currentVal);
                if (match) select.value = currentVal;
            }

            showSuccess('Lists synced!');
        } catch (e) {
            showError(`Sync failed: ${e.message}`);
        } finally {
            btn.disabled = false;
            icon.style.animation = '';
        }
    }

        if (!text) { showError('Enter a note first.'); return; }
        const btn = document.getElementById('heroNoteSaveBtn');
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
            await fetch(`${N8N_BASE}/save-dynasty-note`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    call_sid: currentHeroCallSid,
                    contact_name: currentHeroContact.name,
                    contact_phone: currentHeroContact.phone,
                    note: text,
                    session_id: sessionId,
                    file_id: document.getElementById('listSelect').value,
                    folder_id: document.getElementById('listSelect').options[document.getElementById('listSelect').selectedIndex].dataset.folderId
                })
            });
            showSuccess('Note saved!');
            btn.textContent = 'Saved ✓';
            btn.disabled = true;
        } catch (e) {
            showError(`Error: ${e.message}`);
            btn.disabled = false; btn.textContent = 'Save';
        }
    }

    async function markHeroOptOut() {
        if (!currentHeroContact) return;
        if (!confirm(`Mark ${currentHeroContact.name} as Do Not Call?`)) return;
        try {
            await fetch(`${N8N_BASE}/dynasty-dnc`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contact_phone: currentHeroContact.phone,
                    contact_name: currentHeroContact.name,
                    session_id: sessionId,
                    file_id: document.getElementById('listSelect').value,
                    folder_id: document.getElementById('listSelect').options[document.getElementById('listSelect').selectedIndex].dataset.folderId,
                    dnc: true
                })
            });
            showSuccess(`${currentHeroContact.name} marked as DNC`);
            dismissHeroCard();
        } catch (e) { showError(`Error: ${e.message}`); }
    }
</script>
</body>
