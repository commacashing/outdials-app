<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynasty Power Dialer</title>
    <link rel="icon" href="icon.png">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body.light-mode {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* TOP NAV */
        .top-nav {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .user-org {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover { background: var(--bg-secondary); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-logout:hover { background: var(--bg-secondary); }

        /* CONTROLS BAR */
        .controls-bar {
            width: 100%;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            gap: 24px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-secondary);
            flex-wrap: wrap;
        }

        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .control-input {
            padding: 10px 14px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-weight: 500;
            font-family: inherit;
            min-width: 200px;
        }

        .control-input:focus {
            outline: none;
            border-color: rgba(107, 144, 128, 0.5);
        }

        .phone-wrapper {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .phone-prefix {
            padding: 10px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 16px;
        }

        .btn-start {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 10px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-left: auto;
        }

        .btn-start:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn-start:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-stop {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: rgba(239, 68, 68, 0.9);
        }

        /* LOGIN SCREEN */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .login-container h2 {
            color: var(--text-primary);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-container p {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-input {
            padding: 12px 16px;
            font-size: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
            text-align: center;
        }

        .login-input:focus {
            outline: none;
            border-color: rgba(107, 144, 128, 0.5);
        }

        .btn-primary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* MAIN CONTENT */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .status-section { text-align: center; }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid var(--border-color);
            background: var(--bg-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
        }

        .status-indicator.idle .status-dot { background: #6b9080; }

        .status-indicator.dialing .status-dot {
            background: var(--danger);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* CALL CARD */
        .call-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            max-width: 600px;
            margin: 0 auto;
        }

        .call-card-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .call-card-info {
            color: var(--text-secondary);
            font-size: 15px;
            margin-bottom: 8px;
        }

        .call-card-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn-action {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-note { background: rgba(59, 130, 246, 0.9); color: white; }
        .btn-note:hover { background: rgba(59, 130, 246, 1); transform: scale(1.05); }
        .btn-dnc { background: rgba(239, 68, 68, 0.9); color: white; }
        .btn-dnc:hover { background: rgba(239, 68, 68, 1); transform: scale(1.05); }

        /* ANALYTICS */
        .analytics-section {
            width: 100%;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .analytics-header {
            padding: 20px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .analytics-header h3 {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .analytics-content {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
        }

        .analytics-stat { text-align: center; }

        .analytics-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .analytics-value {
            color: var(--text-primary);
            font-size: 32px;
            font-weight: 700;
        }

        /* MESSAGES */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(400px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #6bff6b;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ff6b6b;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .top-nav { padding: 12px 16px; }
            .controls-bar { padding: 12px 16px; flex-direction: column; }
            .control-input { min-width: auto; width: 100%; }
            .btn-start { margin-left: 0; width: 100%; }
            .main-content { padding: 20px 16px; }
            .analytics-content { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-screen">
    <div class="login-container">
        <h2>Dynasty Power Dialer</h2>
        <p>Dynasty Consulting</p>
        <form class="login-form" onsubmit="handleLogin(event)">
            <input
                type="password"
                id="passwordInput"
                class="login-input"
                placeholder="Enter passcode"
                required
            >
            <button type="submit" id="loginBtn" class="btn-primary">Login</button>
        </form>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardScreen" style="display: none;">
    <!-- TOP NAV -->
    <div class="top-nav">
        <div class="nav-logo">Dynasty Power Dialer</div>
        <div class="nav-user">
            <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>
    </div>

    <!-- CONTROLS BAR -->
    <div class="controls-bar">
        <div class="control-item">
            <span class="control-label">Your Phone</span>
            <div class="phone-wrapper">
                <span class="phone-prefix">+1</span>
                <input
                    type="tel"
                    id="repPhone"
                    class="control-input"
                    placeholder="(212) 555-1234"
                    maxlength="14"
                    oninput="formatPhone(this)"
                    style="min-width: 160px;"
                />
            </div>
        </div>

        <div class="control-item">
            <span class="control-label">List</span>
            <select id="listSelect" class="control-input" onchange="checkFormValid()">
                <option value="">-- Select a list --</option>
            </select>
        </div>

        <div class="control-item">
            <span class="control-label">Region</span>
            <select id="regionSelect" class="control-input" onchange="checkFormValid()">
                <option value="">-- Select region --</option>
            </select>
        </div>

        <div class="control-item">
            <span class="control-label">Min Age</span>
            <input type="number" id="ageMin" class="control-input" placeholder="Min" style="min-width: 80px;" />
        </div>

        <div class="control-item">
            <span class="control-label">Max Age</span>
            <input type="number" id="ageMax" class="control-input" placeholder="Max" style="min-width: 80px;" />
        </div>

        <button id="startButton" onclick="startDialing()" class="btn-start" disabled>
            Start Dialing
        </button>
        <button id="stopButton" onclick="stopDialing()" class="btn-start btn-stop" style="display: none;">
            Stop Dialing
        </button>
    </div>

    <!-- ANALYTICS -->
    <div class="analytics-section" style="padding: 0 40px;">
        <div class="analytics-header" onclick="toggleAnalytics()">
            <h3>Session Analytics</h3>
        </div>
        <div class="analytics-content">
            <div class="analytics-stat">
                <div class="analytics-label">Total Calls</div>
                <div class="analytics-value" id="statTotalCalls">0</div>
            </div>
            <div class="analytics-stat">
                <div class="analytics-label">Connects</div>
                <div class="analytics-value" id="statConnects">0</div>
            </div>
            <div class="analytics-stat">
                <div class="analytics-label">Talk Time</div>
                <div class="analytics-value" id="statTalkTime">0m</div>
            </div>
            <div class="analytics-stat">
                <div class="analytics-label">Calls/Hour</div>
                <div class="analytics-value" id="statCallsPerHour">0</div>
            </div>
            <div class="analytics-stat">
                <div class="analytics-label">Machine Rate</div>
                <div class="analytics-value" id="statMachineRate">0%</div>
            </div>
            <div class="analytics-stat">
                <div class="analytics-label">Avg Duration</div>
                <div class="analytics-value" id="statAvgDuration">0m</div>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="status-section">
            <div class="status-indicator idle" id="dialerStatus">
                <span class="status-dot"></span>
                <span id="statusText">System Ready</span>
            </div>
        </div>

        <div id="callCardContainer" style="display: none;">
            <div class="call-card">
                <div class="call-card-name" id="callCardName">Loading...</div>
                <div class="call-card-info"><strong id="callCardCompany">-</strong></div>
                <div class="call-card-info" id="callCardPhone">-</div>
                <div class="call-card-info" id="callCardLicenses">-</div>
                <div class="call-card-info" id="callCardYears">-</div>
                <div class="call-card-actions">
                    <button class="btn-action btn-note" onclick="toggleNote()">📝 Note</button>
                    <button class="btn-action btn-dnc" onclick="markOptOut()">🚫 DNC</button>
                </div>
                <textarea
                    id="noteText"
                    style="width:100%;margin-top:16px;padding:8px;border-radius:8px;border:1px solid var(--border-color);background:var(--bg-primary);color:var(--text-primary);display:none;min-height:80px;font-family:inherit;"
                    placeholder="Add notes..."
                ></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const N8N_BASE = 'https://commacashing.app.n8n.cloud/webhook';
    const START_URL = `${N8N_BASE}/start-dynasty`;
    const STOP_URL  = `${N8N_BASE}/stop-dynasty`;
    const COMPANY_CODE = 'dynasty';

    let supabaseClient = null;
    let isDialing = false;
    let currentSessionId = null;
    let supabaseSubscription = null;
    let currentSession = {
        totalCalls: 0,
        connects: 0,
        machines: 0,
        callDurations: [],
        startTime: null
    };
    let currentContact = null;

    // ============================================
    // INIT
    // ============================================
    window.addEventListener('DOMContentLoaded', async () => {
        await initSupabase();

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            document.querySelector('.theme-toggle').textContent = '☀️';
        }

        // Restore session if still logged in
        if (localStorage.getItem('dynasty_authed') === 'true') {
            showDashboard();
        }
    });

    async function initSupabase() {
        try {
            const response = await fetch('/.netlify/functions/supabase-init', { method: 'POST' });
            const { url, key } = await response.json();
            supabaseClient = window.supabase.createClient(url, key);
            await loadLists();
            await loadRegions();
        } catch (error) {
            console.error('Failed to initialize Supabase:', error);
        }
    }

    // ============================================
    // LOGIN
    // ============================================
    async function handleLogin(e) {
        e.preventDefault();
        const password = document.getElementById('passwordInput').value;
        const btn = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.textContent = 'Checking...';

        try {
            const { data, error } = await supabaseClient
                .from('companies')
                .select('admin_passcode')
                .eq('company_code', COMPANY_CODE)
                .single();

            if (error || !data) {
                showError('Could not verify credentials. Try again.');
                btn.disabled = false;
                btn.textContent = 'Login';
                return;
            }

            if (password !== data.admin_passcode) {
                showError('Incorrect passcode.');
                btn.disabled = false;
                btn.textContent = 'Login';
                document.getElementById('passwordInput').value = '';
                return;
            }

            localStorage.setItem('dynasty_authed', 'true');
            showDashboard();
            showSuccess('Welcome to Dynasty Power Dialer!');
        } catch (err) {
            showError(`Login error: ${err.message}`);
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    }

    function showDashboard() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('dashboardScreen').style.display = 'block';
    }

    function logout() {
        localStorage.removeItem('dynasty_authed');
        if (isDialing) stopDialing();
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('dashboardScreen').style.display = 'none';
        document.getElementById('passwordInput').value = '';
    }

    // ============================================
    // LOAD LISTS & REGIONS
    // ============================================
    async function loadLists() {
        if (!supabaseClient) return;
        try {
            const { data, error } = await supabaseClient
                .from('contact_lists')
                .select('list_source, file_name, imported_contacts')
                .eq('company_code', COMPANY_CODE)
                .order('file_name');

            if (error) throw error;

            const select = document.getElementById('listSelect');
            if (data && data.length > 0) {
                data.forEach(list => {
                    const option = document.createElement('option');
                    option.value = list.list_source;
                    option.textContent = `${list.file_name} (${list.imported_contacts || 0} contacts)`;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load lists:', error);
        }
    }

    async function loadRegions() {
        if (!supabaseClient) return;
        try {
            const { data, error } = await supabaseClient
                .from('rep_numbers')
                .select('region')
                .eq('company_code', COMPANY_CODE);

            if (error) throw error;

            const regions = [...new Set((data || []).map(r => r.region).filter(Boolean))].sort();
            const select = document.getElementById('regionSelect');

            if (regions.length > 0) {
                regions.forEach(region => {
                    const option = document.createElement('option');
                    option.value = region;
                    option.textContent = region;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load regions:', error);
            // Fallback static regions if table query fails
            ['Northeast', 'Southeast', 'Midwest', 'Southwest', 'West'].forEach(r => {
                const option = document.createElement('option');
                option.value = r;
                option.textContent = r;
                document.getElementById('regionSelect').appendChild(option);
            });
        }
    }

    // ============================================
    // FORM VALIDATION
    // ============================================
    function formatPhone(input) {
        let digits = input.value.replace(/\D/g, '').slice(0, 10);
        if (digits.length >= 6) {
            input.value = `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
        } else if (digits.length >= 3) {
            input.value = `(${digits.slice(0,3)}) ${digits.slice(3)}`;
        } else {
            input.value = digits;
        }
        checkFormValid();
    }

    function checkFormValid() {
        const digits = document.getElementById('repPhone').value.replace(/\D/g, '');
        const list = document.getElementById('listSelect').value;
        const region = document.getElementById('regionSelect').value;
        const valid = digits.length === 10 && list !== '' && region !== '';
        document.getElementById('startButton').disabled = !valid || isDialing;
    }

    // ============================================
    // DIALING
    // ============================================
    async function startDialing() {
        const repPhone = '+1' + document.getElementById('repPhone').value.replace(/\D/g, '');
        const listSource = document.getElementById('listSelect').value;
        const region = document.getElementById('regionSelect').value;
        const ageMin = document.getElementById('ageMin').value;
        const ageMax = document.getElementById('ageMax').value;

        try {
            isDialing = true;
            currentSessionId = `session_${Date.now()}`;
            currentSession.startTime = Date.now();

            document.getElementById('startButton').style.display = 'none';
            document.getElementById('stopButton').style.display = 'inline-block';
            document.getElementById('repPhone').disabled = true;
            document.getElementById('listSelect').disabled = true;
            document.getElementById('regionSelect').disabled = true;
            document.getElementById('callCardContainer').style.display = 'block';
            updateStatus('dialing', 'Dialing Active');

            subscribeToCallLogs();

            await fetch(START_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    rep_phone: repPhone,
                    list_source: listSource,
                    region: region,
                    filters: { age_min: ageMin || null, age_max: ageMax || null }
                })
            });

            showSuccess('Dialing started!');
        } catch (error) {
            showError(`Failed to start dialing: ${error.message}`);
            resetDialing();
        }
    }

    async function stopDialing() {
        try {
            isDialing = false;

            if (supabaseSubscription && supabaseClient) {
                supabaseClient.removeChannel(supabaseSubscription);
                supabaseSubscription = null;
            }

            const repPhone = '+1' + document.getElementById('repPhone').value.replace(/\D/g, '');

            await fetch(STOP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    rep_phone: repPhone
                })
            });

            resetDialing();
            showSuccess('Dialing stopped');
        } catch (error) {
            showError(`Failed to stop: ${error.message}`);
        }
    }

    function resetDialing() {
        isDialing = false;
        document.getElementById('stopButton').style.display = 'none';
        document.getElementById('startButton').style.display = 'inline-block';
        document.getElementById('repPhone').disabled = false;
        document.getElementById('listSelect').disabled = false;
        document.getElementById('regionSelect').disabled = false;
        document.getElementById('callCardContainer').style.display = 'none';
        updateStatus('idle', 'System Ready');
        checkFormValid();
    }

    // ============================================
    // REAL-TIME SUBSCRIPTIONS
    // ============================================
    function subscribeToCallLogs() {
        if (!supabaseClient) return;

        supabaseSubscription = supabaseClient
            .channel(`dynasty_calls_${currentSessionId}`)
            .on('postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'dynasty_call_logs',
                    filter: `session_id=eq.${currentSessionId}`
                },
                (payload) => handleCallEvent(payload.new)
            )
            .subscribe();
    }

    async function handleCallEvent(log) {
        if (!log) return;

        const eventType = log.event_type;

        if (eventType === 'human_answered') {
            currentSession.connects++;
            currentSession.humanAnsweredTime = Date.now();

            document.getElementById('callCardName').textContent = log.contact_name || 'Unknown';
            document.getElementById('callCardCompany').textContent = log.contact_company || '-';
            document.getElementById('callCardPhone').textContent = log.phone || '-';
            document.getElementById('callCardLicenses').textContent = log.licenses ? `Licenses: ${log.licenses}` : '';
            document.getElementById('callCardYears').textContent = log.years_at_firm ? `Years at firm: ${log.years_at_firm}` : '';

            currentContact = log;
            updateStatus('on-call', 'On Call');
        }
        else if (eventType === 'machine_detected') {
            currentSession.machines++;
        }
        else if (eventType === 'call_completed') {
            if (currentSession.humanAnsweredTime) {
                const duration = (Date.now() - currentSession.humanAnsweredTime) / 1000;
                if (duration > 0 && duration < 3600) {
                    currentSession.callDurations.push(duration);
                }
                currentSession.humanAnsweredTime = null;
            }
            updateStatus('dialing', 'Dialing Active');
        }

        currentSession.totalCalls++;
        updateStatsDisplay();
    }

    // ============================================
    // UI HELPERS
    // ============================================
    function updateStatus(state, text) {
        document.getElementById('dialerStatus').className = `status-indicator ${state}`;
        document.getElementById('statusText').textContent = text;
    }

    function updateStatsDisplay() {
        document.getElementById('statTotalCalls').textContent = currentSession.totalCalls;
        document.getElementById('statConnects').textContent = currentSession.connects;

        const totalMinutes = Math.round(
            currentSession.callDurations.reduce((a, b) => a + b, 0) / 60
        );
        document.getElementById('statTalkTime').textContent = totalMinutes + 'm';

        if (currentSession.startTime) {
            const hoursElapsed = (Date.now() - currentSession.startTime) / 3600000;
            const cph = hoursElapsed > 0 ? Math.round(currentSession.totalCalls / hoursElapsed) : 0;
            document.getElementById('statCallsPerHour').textContent = cph;
        }

        const machineRate = currentSession.totalCalls > 0
            ? Math.round((currentSession.machines / currentSession.totalCalls) * 100)
            : 0;
        document.getElementById('statMachineRate').textContent = machineRate + '%';

        if (currentSession.callDurations.length > 0) {
            const avg = currentSession.callDurations.reduce((a, b) => a + b, 0) / currentSession.callDurations.length;
            document.getElementById('statAvgDuration').textContent =
                avg < 60 ? Math.round(avg) + 's' : Math.round(avg / 60) + 'm';
        }
    }

    function toggleNote() {
        const ta = document.getElementById('noteText');
        ta.style.display = ta.style.display === 'none' ? 'block' : 'none';
    }

    async function markOptOut() {
        const name = document.getElementById('callCardName').textContent;
        if (!confirm(`Mark ${name} as Do Not Call?`)) return;
        // Wire up to your DNC webhook when ready
        showSuccess(`${name} added to DNC list`);
    }

    function toggleTheme() {
        document.body.classList.toggle('light-mode');
        const btn = document.querySelector('.theme-toggle');
        btn.textContent = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    function toggleAnalytics() {
        const content = document.querySelector('.analytics-content');
        content.style.display = content.style.display === 'none' ? 'grid' : 'none';
    }

    function showSuccess(message) {
        const msg = document.createElement('div');
        msg.className = 'message success';
        msg.textContent = message;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 3000);
    }

    function showError(message) {
        const msg = document.createElement('div');
        msg.className = 'message error';
        msg.textContent = message;
        document.body.appendChild(msg);
        setTimeout(() => msg.remove(), 4000);
    }
</script>
</body>
</html>
